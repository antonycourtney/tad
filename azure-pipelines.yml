# Azure Pipelines CI setup for cross-platform builds of Tad desktop app
#
# CI builds package (and on macOS sign and notarize) the app, but never
# publish to GitHub Releases (`npm run dist` = electron-builder --publish=never).
# The installers are attached to each run as pipeline artifacts.
#
name: $(Build.Reason)_$(Build.SourceBranch)_$(Rev:r)

# Build every push to master, as a check that it still builds on each
# platform, and pull requests (the default). N.B. triggers set in the Azure
# Pipelines web UI override these.
trigger:
  - master

jobs:
  - job: Windows
    timeoutInMinutes: 45
    pool:
      vmImage: windows-latest
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: 22.x
        displayName: "Use node.js 22"
      - script: npm ci
        displayName: "Install npm workspace dependencies"
      - script: node tools/buildAll.js
        displayName: "Build all packages"
      - script: npm run dist
        workingDirectory: packages/tad-app
        displayName: "Build packaged tad-app with electron-builder"
      - task: CopyFiles@2
        inputs:
          sourceFolder: "packages/tad-app/release"
          contents: "*"
          targetFolder: $(Build.ArtifactStagingDirectory)
      - task: PublishBuildArtifacts@1
        inputs:
          pathToPublish: $(Build.ArtifactStagingDirectory)
          artifactName: WindowsBuildOutputs

  - job: Linux
    timeoutInMinutes: 55
    pool:
      vmImage: ubuntu-latest
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: 22.x
        displayName: "Use node.js 22"
      - script: npm ci
        displayName: "Install npm workspace dependencies"
      - script: "node ./tools/buildAll.js"
        displayName: "Build all packages"
      - script: "( cd packages/tad-app && BUILD_BUILDNUMBER='' npm run dist )"
        displayName: "Build packaged tad-app with electron-builder"
        env:
          {
            BUILDNUMBER: " ",
            BUILD_BUILDNUMBER: " ",
            CI_PIPELINE_IID: " ",
          }
      - task: CopyFiles@2
        inputs:
          contents: "packages/tad-app/release/tad*"
          targetFolder: $(Build.ArtifactStagingDirectory)
      - task: PublishBuildArtifacts@1
        inputs:
          pathToPublish: $(Build.ArtifactStagingDirectory)
          artifactName: LinuxBuildOutputs

  - job: macOS_latest
    timeoutInMinutes: 55
    pool:
      vmImage: macOS-latest
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: 22.x
        displayName: "Use node.js 22"
      - task: DownloadSecureFile@1
        name: devCertificate
        displayName: "Download Apple Dev Certificate"
        inputs:
          secureFile: "apple-dev-certificate.p12"
      - script: npm ci
        displayName: "Install npm workspace dependencies"
      - script: "node ./tools/buildAll.js"
        displayName: "Build all packages"
      - script: "( cd packages/tad-app && npm run dist )"
        displayName: "Build packaged tad-app with electron-builder"
        env:
          {
            APPLEID: $(APPLEID),
            APPLEIDPASS: $(APPLEIDPASS),
            CSC_LINK: $(devCertificate.secureFilePath),
            CSC_KEY_PASSWORD: $(APPLEIDPASS),
          }
      - task: CopyFiles@2
        inputs:
          contents: "packages/tad-app/release/Tad*.zip"
          targetFolder: $(Build.ArtifactStagingDirectory)
      - task: CopyFiles@2
        inputs:
          contents: "packages/tad-app/release/Tad*.dmg"
          targetFolder: $(Build.ArtifactStagingDirectory)
      - task: PublishBuildArtifacts@1
        inputs:
          pathToPublish: $(Build.ArtifactStagingDirectory)
          artifactName: MacOSBuildOutputs
