# Azure Pipelines CI setup for cross-platform builds of Tad desktop app
#
# CI builds package (and on macOS sign and notarize) the app, but never
# publish to GitHub Releases (`npm run dist` = electron-builder --publish=never).
# The installers are attached to each run as pipeline artifacts.
#
# Every job runs the unit tests (`npm test`). The Linux and Windows jobs then
# run the desktop app's UI tests (packages/tad-app/e2e); their results show in
# the run's Tests tab, and on failure e2e-results/ (screenshots, accessibility
# snapshots) is attached as an artifact. The Linux job also runs the tests of
# the new UI (TAD_UI=new) that's being built (doc/ui-todo.md).
#
name: $(Build.Reason)_$(Build.SourceBranch)_$(Rev:r)

# Build every push to master, as a check that it still builds on each
# platform, and pull requests (the default). N.B. triggers set in the Azure
# Pipelines web UI override these.
trigger:
  - master

jobs:
  - job: Windows
    timeoutInMinutes: 45
    pool:
      vmImage: windows-latest
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: 22.x
        displayName: "Use node.js 22"
      - script: npm ci
        displayName: "Install npm workspace dependencies"
      - script: node tools/buildAll.js
        displayName: "Build all packages"
      - script: npm test
        displayName: "Unit tests"
      - script: npm run dist
        workingDirectory: packages/tad-app
        displayName: "Build packaged tad-app with electron-builder"
      - task: CopyFiles@2
        inputs:
          sourceFolder: "packages/tad-app/release"
          contents: "*"
          targetFolder: $(Build.ArtifactStagingDirectory)
      - task: PublishBuildArtifacts@1
        inputs:
          pathToPublish: $(Build.ArtifactStagingDirectory)
          artifactName: WindowsBuildOutputs
      - script: npx playwright test
        workingDirectory: packages/tad-app
        displayName: "UI tests"
        env: { CI: "true" }
      - task: PublishTestResults@2
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: packages/tad-app/e2e-results/junit.xml
          testRunTitle: "UI tests (Windows)"
      - task: PublishBuildArtifacts@1
        condition: failed()
        inputs:
          pathToPublish: packages/tad-app/e2e-results
          artifactName: WindowsUITestResults

  - job: Linux
    timeoutInMinutes: 55
    pool:
      vmImage: ubuntu-latest
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: 22.x
        displayName: "Use node.js 22"
      - script: npm ci
        displayName: "Install npm workspace dependencies"
      - script: "node ./tools/buildAll.js"
        displayName: "Build all packages"
      - script: npm test
        displayName: "Unit tests"
      - script: "( cd packages/tad-app && BUILD_BUILDNUMBER='' npm run dist )"
        displayName: "Build packaged tad-app with electron-builder"
        env:
          {
            BUILDNUMBER: " ",
            BUILD_BUILDNUMBER: " ",
            CI_PIPELINE_IID: " ",
          }
      - task: CopyFiles@2
        inputs:
          contents: "packages/tad-app/release/tad*"
          targetFolder: $(Build.ArtifactStagingDirectory)
      - task: PublishBuildArtifacts@1
        inputs:
          pathToPublish: $(Build.ArtifactStagingDirectory)
          artifactName: LinuxBuildOutputs
      # Electron's sandbox needs unprivileged user namespaces, which Ubuntu
      # 24.04 restricts by default; the app needs a display (Xvfb):
      - script: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          which xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
        displayName: "Prepare for UI tests"
      - script: xvfb-run -a --server-args="-screen 0 1920x1080x24" npx playwright test
        workingDirectory: packages/tad-app
        displayName: "UI tests"
        env: { CI: "true" }
      - task: PublishTestResults@2
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: packages/tad-app/e2e-results/junit.xml
          testRunTitle: "UI tests (Linux)"
      - task: PublishBuildArtifacts@1
        condition: failed()
        inputs:
          pathToPublish: packages/tad-app/e2e-results
          artifactName: LinuxUITestResults
      # The new UI (TAD_UI=new, see doc/ui-todo.md), while it's being built:
      # the tests of what it has so far.
      - script: xvfb-run -a --server-args="-screen 0 1920x1080x24" npx playwright test e2e/view-controls.e2e.ts e2e/filter-bar.e2e.ts
        workingDirectory: packages/tad-app
        displayName: "UI tests (new UI)"
        condition: succeededOrFailed()
        env: { CI: "true", TAD_UI: "new" }
      - task: PublishTestResults@2
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: packages/tad-app/e2e-results-new-ui/junit.xml
          testRunTitle: "UI tests, new UI (Linux)"
      - task: PublishBuildArtifacts@1
        condition: failed()
        inputs:
          pathToPublish: packages/tad-app/e2e-results-new-ui
          artifactName: LinuxNewUITestResults

  - job: macOS_latest
    timeoutInMinutes: 55
    pool:
      vmImage: macOS-latest
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: 22.x
        displayName: "Use node.js 22"
      - task: DownloadSecureFile@1
        name: devCertificate
        displayName: "Download Apple Dev Certificate"
        inputs:
          secureFile: "apple-dev-certificate.p12"
      - script: npm ci
        displayName: "Install npm workspace dependencies"
      - script: "node ./tools/buildAll.js"
        displayName: "Build all packages"
      - script: npm test
        displayName: "Unit tests"
      - script: "( cd packages/tad-app && npm run dist )"
        displayName: "Build packaged tad-app with electron-builder"
        env:
          {
            APPLEID: $(APPLEID),
            APPLEIDPASS: $(APPLEIDPASS),
            CSC_LINK: $(devCertificate.secureFilePath),
            CSC_KEY_PASSWORD: $(APPLEIDPASS),
          }
      - task: CopyFiles@2
        inputs:
          contents: "packages/tad-app/release/Tad*.zip"
          targetFolder: $(Build.ArtifactStagingDirectory)
      - task: CopyFiles@2
        inputs:
          contents: "packages/tad-app/release/Tad*.dmg"
          targetFolder: $(Build.ArtifactStagingDirectory)
      - task: PublishBuildArtifacts@1
        inputs:
          pathToPublish: $(Build.ArtifactStagingDirectory)
          artifactName: MacOSBuildOutputs
